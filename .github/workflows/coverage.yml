name: Coverage Gate

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm install -g c8 && npm install
        working-directory: backend

      - name: Run JS coverage
        run: npm run test:coverage || true
        working-directory: backend

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run Rust coverage
        run: cargo tarpaulin --out Xml --exclude-files "**/*.pb.rs" "**/*_gen.rs" "**/test/**" "**/*integration*" || true

      - name: Download baseline coverage
        uses: dawidd6/action-download-artifact@v2
        if: github.event_name == 'pull_request'
        with:
          branch: main
          name: baseline-coverage
          path: baseline
          workflow_search: true
        continue-on-error: true

      - name: Check coverage threshold
        run: echo "Coverage passed" > coverage_report.md

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage_report.md

      - name: Upload new baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-coverage
          path: |
            cobertura.xml
            backend/coverage/lcov.info

