[package]
name = "merkle_vault"
version = "0.1.0"
description = "Merkle tree-based vesting airdrops - single root, claim with proof"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
